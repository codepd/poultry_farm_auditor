name: Build and Push Go API Image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "go_api/**"
      - ".github/workflows/be-ecr-build.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO: poultry-dev-go-api
  AWS_ACCOUNT_ID: "155139664929"
  EKS_CLUSTER_NAME: kolipannai-dev-eks
  K8S_NAMESPACE: poultry-dev
  K8S_DEPLOYMENT: go-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image-meta.outputs.image_uri }}
      image_tag: ${{ steps.image-meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.AWS_ACCOUNT_ID }}

      - name: Determine image tag
        id: image-meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPO }}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="${GITHUB_SHA::12}"
          fi

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image: $IMAGE_URI:$IMAGE_TAG"

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${{ steps.image-meta.outputs.image_uri }}"
          IMAGE_TAG="${{ steps.image-meta.outputs.image_tag }}"
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -f go_api/Dockerfile go_api
          docker push "$IMAGE_URI:$IMAGE_TAG"

          # Keep latest moving only on main branch builds.
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker tag "$IMAGE_URI:$IMAGE_TAG" "$IMAGE_URI:latest"
            docker push "$IMAGE_URI:latest"
          fi

  deploy-to-eks:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Deploy tagged image to Kubernetes
        run: |
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

          kubectl -n "${{ env.K8S_NAMESPACE }}" set image deployment/"${{ env.K8S_DEPLOYMENT }}" \
            go-api="$IMAGE_URI:$IMAGE_TAG"
          kubectl -n "${{ env.K8S_NAMESPACE }}" rollout status deployment/"${{ env.K8S_DEPLOYMENT }}" --timeout=180s
          kubectl -n "${{ env.K8S_NAMESPACE }}" get pods -l app=go-api
