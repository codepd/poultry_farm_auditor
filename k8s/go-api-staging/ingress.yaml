apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-api-ingress
  namespace: poultry-staging
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Replace with ACM certificate ARN for api-staging.mykolipannai.com (ap-south-1)
    alb.ingress.kubernetes.io/certificate-arn: "REPLACE_WITH_STAGING_API_ACM_CERT_ARN"
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - host: api-staging.mykolipannai.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  number: 8080
