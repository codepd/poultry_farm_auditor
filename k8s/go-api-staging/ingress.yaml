apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-api-ingress
  namespace: poultry-staging
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # ACM certificate ARN for api-staging.mykolipannai.com (ap-south-1)
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:155139664929:certificate/7d9a3d75-b898-441a-88d9-edc79dfe8093"
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - host: api-staging.mykolipannai.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: go-api
                port:
                  number: 8080
